<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oakcraft — Kitting Management System</title>
  <style>
/* ============================================================
   Oakcraft Kitting Management System — styles
   Design tokens follow the validated reference dataviz palette.
   ============================================================ */

:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);

  --s1: #2a78d6;  /* series blue   */
  --s2: #eb6834;  /* series orange */
  --s3: #1baf7a;  /* series aqua   */

  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --good-text: #006300;

  --brand: #104281;
  --brand-2: #1c5cab;
  --sidebar-bg: #0d1b2e;
  --sidebar-ink: #c9d4e3;

  --radius: 10px;
  --shadow: 0 1px 3px rgba(11,11,11,.06), 0 4px 14px rgba(11,11,11,.05);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --baseline: #383835;
  --ring: rgba(255, 255, 255, 0.10);

  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;

  --good-text: #0ca30c;
  --brand: #184f95;
  --brand-2: #3987e5;
  --sidebar-bg: #101418;
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink);
  font-size: 14px;
}

/* ---------------- layout ---------------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px; flex-shrink: 0;
  background: var(--sidebar-bg); color: var(--sidebar-ink);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand .logo { font-weight: 700; font-size: 16px; color: #fff; letter-spacing: .2px; }
.brand .tag { font-size: 11px; color: #7f93ad; margin-top: 2px; }

.nav { padding: 10px 8px; flex: 1; overflow-y: auto; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  background: none; border: 0; color: var(--sidebar-ink);
  font: inherit; font-size: 13.5px;
  padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
}
.nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav button.active { background: var(--brand-2); color: #fff; font-weight: 600; }
.nav .icon { width: 18px; text-align: center; font-size: 15px; }
.nav .count {
  margin-left: auto; background: rgba(255,255,255,.14); color: #fff;
  border-radius: 20px; font-size: 11px; padding: 1px 8px; font-variant-numeric: tabular-nums;
}
.sidebar .foot { padding: 12px 18px; font-size: 11px; color: #66788f; border-top: 1px solid rgba(255,255,255,.08); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 22px; background: var(--surface);
  border-bottom: 1px solid var(--grid);
  position: sticky; top: 0; z-index: 30;
}
.topbar h1 { font-size: 16px; margin: 0; font-weight: 650; }
.topbar .spacer { flex: 1; }
.searchbox { position: relative; }
.searchbox input {
  width: 300px; max-width: 40vw;
  padding: 8px 12px 8px 32px; border: 1px solid var(--grid); border-radius: 8px;
  background: var(--page); color: var(--ink); font: inherit;
}
.searchbox::before { content: "\1F50D"; position: absolute; left: 10px; top: 8px; font-size: 12px; opacity: .55; }
.sync { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

.content { padding: 20px 22px 60px; }

/* ---------------- cards & panels ---------------- */
.card {
  background: var(--surface); border: 1px solid var(--ring);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 18px; margin-bottom: 16px;
}
.card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 650; }
.card h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .grid.cols-4 { grid-template-columns: 1fr 1fr; } .grid.cols-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px)  { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

/* stat tiles */
.stat { padding: 14px 16px; }
.stat .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.stat .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stat .value { font-size: 27px; font-weight: 700; margin-top: 6px; }
.stat .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* ---------------- tables ---------------- */
.tablewrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--baseline);
  white-space: nowrap; cursor: pointer; user-select: none;
}
.tbl th .arrow { font-size: 9px; margin-left: 3px; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.tbl tr:hover td { background: color-mix(in srgb, var(--s1) 5%, transparent); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .rowactions { white-space: nowrap; text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 32px 10px; font-size: 13px; }

/* ---------------- pills / badges ---------------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-good { color: var(--good-text); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill-warn { color: #8a5a00; background: color-mix(in srgb, var(--warning) 20%, transparent); }
:root[data-theme="dark"] .pill-warn { color: var(--warning); }
.pill-bad  { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.pill-info { color: var(--brand-2); background: color-mix(in srgb, var(--s1) 12%, transparent); }
.pill-muted { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }

.kit-complete { color: var(--good-text); font-weight: 700; }
.kit-pending { color: var(--critical); font-weight: 700; }

/* coverage meter */
.meter { background: var(--grid); border-radius: 6px; height: 8px; width: 110px; display: inline-block; vertical-align: middle; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--s1); border-radius: 6px; }
.meter.full > span { background: var(--good); }

/* ---------------- forms ---------------- */
.frm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
@media (max-width: 900px) { .frm { grid-template-columns: 1fr 1fr; } }
@media (max-width: 620px) { .frm { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--baseline); border-radius: 8px;
  background: var(--surface); color: var(--ink); font: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid color-mix(in srgb, var(--s1) 55%, transparent); border-color: var(--s1);
}
.field.span2 { grid-column: span 2; }
.field.span3 { grid-column: 1 / -1; }
.formactions { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--baseline); background: var(--surface); color: var(--ink);
}
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn-primary:hover { background: var(--brand); border-color: var(--brand); }
.btn-danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
.btn-danger:hover { background: color-mix(in srgb, var(--critical) 8%, transparent); }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn-icon { padding: 6px 9px; }
.btn-order { background: var(--s2); border-color: var(--s2); color: #fff; }
.btn-order:hover { filter: brightness(.92); }

/* filter bar */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.filters .field { min-width: 150px; }
.filters .field input, .filters .field select { padding: 7px 9px; }

/* ---------------- charts ---------------- */
.chartbox { position: relative; height: 260px; }
.chartbox.tall { height: 320px; }

/* ---------------- modal ---------------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 90;
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px;
}
.modal {
  background: var(--surface); border-radius: 12px; box-shadow: 0 12px 50px rgba(0,0,0,.3);
  width: 100%; max-width: 900px; max-height: 86vh; display: flex; flex-direction: column;
}
.modal header {
  display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--grid);
}
.modal header h3 { margin: 0; font-size: 15px; }
.modal header .x { margin-left: auto; background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal .body { padding: 16px 18px; overflow-y: auto; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--grid); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------------- toasts ---------------- */
#toasts { position: fixed; bottom: 18px; right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: var(--page);
  padding: 10px 16px; border-radius: 9px; font-size: 13px; font-weight: 500;
  opacity: 0; transform: translateY(8px); transition: all .25s;
  max-width: 360px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.toast.show { opacity: 1; transform: none; }
.toast-good { background: var(--good-text); color: #fff; }
.toast-bad { background: var(--critical); color: #fff; }

/* ---------------- misc ---------------- */
.loading-overlay {
  position: fixed; inset: 0; background: var(--page); z-index: 300;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.spinner {
  width: 34px; height: 34px; border: 3px solid var(--grid); border-top-color: var(--s1);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.mt { margin-top: 14px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.right { text-align: right; }
.toolrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolrow .spacer { flex: 1; }
.notice {
  background: color-mix(in srgb, var(--warning) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent);
  padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 14px;
}
.setup-hint code { background: var(--grid); padding: 2px 6px; border-radius: 5px; font-size: 12px; }

/* mobile */
@media (max-width: 860px) {
  .sidebar { position: fixed; left: -240px; transition: left .2s; z-index: 100; }
  .sidebar.open { left: 0; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .hamburger { display: inline-flex !important; }
  .searchbox input { width: 160px; }
}
.hamburger { display: none; }

@media print {
  .sidebar, .topbar, .filters, .toolrow, .btn, #toasts { display: none !important; }
  .content { padding: 0; }
  .card { box-shadow: none; border: none; }
}

</style>

<body>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="muted small" id="loadingMsg">Connecting to Google Sheets…</div>
  </div>

  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo"><img src="logo.png" alt="OakCraft" style="width:26px;height:26px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;vertical-align:middle;margin-right:6px;">🪑 Oakcraft</div>
        <div class="tag">Kitting Management System</div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="dashboard"><span class="icon">📊</span> Dashboard</button>
        <button data-view="orders"><span class="icon">🧾</span> Order Form <span class="count" id="cnt-orders">0</span></button>
        <button data-view="bom"><span class="icon">🧩</span> Kitting Master <span class="count" id="cnt-bom">0</span></button>
        <button data-view="fg"><span class="icon">🏭</span> FG Status</button>
        <button data-view="inventory"><span class="icon">📦</span> Live Inventory <span class="count" id="cnt-inv">0</span></button>
        <button data-view="kitting"><span class="icon">✅</span> Full Kitting Status</button>
        <button data-view="pr"><span class="icon">🛒</span> Purchase Requirements <span class="count" id="cnt-pr">0</span></button>
        <button data-view="reports"><span class="icon">📈</span> Reports</button>
        <button data-view="settings"><span class="icon">⚙️</span> Settings</button>
      </nav>
      <div class="foot">v1.0 · Google Sheets backend</div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <div class="topbar">
        <button class="btn btn-icon hamburger" id="hamburger">☰</button>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="spacer"></div>
        <div class="searchbox"><input id="globalSearch" type="search" placeholder="Search orders, materials, products…" /></div>
        <span class="sync" id="syncInfo">—</span>
        <button class="btn btn-icon" id="refreshBtn" title="Refresh from Google Sheets">⟳</button>
        <button class="btn btn-icon" id="themeBtn" title="Toggle dark mode">🌙</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts"></div>

  <script>

/* ========== config.js ========== */
/* ============================================================
   CONFIG — the ONLY file you must edit after deployment
   ============================================================ */
window.KMS_CONFIG = {
  // 1. Deploy backend/Code.gs as a Web App (Anyone can access)
  // 2. Paste the Web App URL here (ends with /exec)
  API_URL: 'https://script.google.com/macros/s/AKfycbyUlW3TGaFK4oTjmceZ1QTcqdlNKW4R5d0XGvYNbtUiFPM-XloAvu8srbwupl4y2XK2Bg/exec',

  // Background auto-sync interval (milliseconds).
  // NOTE: your own saves/edits/deletes sync to Google Sheets INSTANTLY —
  // this timer only picks up changes made by OTHER users or directly in the sheet.
  REFRESH_MS: 20000,

  // Company details used on screen + PDF headers
  COMPANY_NAME: 'Oakcraft Furniture',
  COMPANY_TAGLINE: 'Kitting Management System',

  // FALLBACK dropdown lists — used only until the Masters sheet loads.
  // The REAL lists come live from the "Masters" tab of your Google Sheet:
  // add a value in any Masters column and it appears in the app automatically.
  CHAIR_CATEGORIES: ['KBC', 'HIGH BACK CHAIR', 'MEDIUM BACK CHAIR', 'MESH CHAIR W', 'MESH CHAIR G', 'BOOM BLACK', 'ROBO WHITE', 'POLO WHITE', '898 CHAIR', '805 CHAIR', '802 CHAIR', 'NAG NAGIN', 'MATRIX HIGH BACK BLACK', '15 NO CHAIR', 'SPINAL HB1', 'SPINAL HB2', 'SPINAL HB3', 'KBC CHAIR'],
  SUB_CATEGORIES: ['Chair', 'Sofa', 'Wardrobe (Almirah)', 'Recliner Chair', 'Recliner Sofa', 'Bed', 'Table', 'Other'],
  // Standard raw-material lines auto-loaded when Chair Category = Chair
  CHAIR_PRESET_MATERIALS: ['Handle', 'Plate', 'Foam', 'Fabric', 'Base', 'Wheels', 'Hydraulic', 'Back Patta', 'Frame', 'Tower Bally', 'Ply', 'Hardware'],
  // Raw materials whose "Type" box is a tick-box list (multiple items can be
  // selected). Values come from the same Inventory Category (col C) match.
  BOM_MULTI_SELECT_MATERIALS: ['Hardware'],
  // Agar Inventory sheet ki Category spelling app ke raw material naam se alag
  // ho to yahan jod dijiye - left = raw material name, right = Inventory Category.
  MATERIAL_CATEGORY_ALIASES: { 'Tower Bally': 'Tower Belly' },
  // Kitting Master → "Type" dropdown lists. Live values come from the Masters
  // tab (one column per raw material name); this is only the offline fallback.
  BOM_TYPE_LISTS: {
    'Handle': ['816 Handle', '817 Handle', '603 Handle', 'Sonic Handle', 'U Type Handle', 'Ola Handle Black', 'Ola Handle White', '3D Handle With Pu Pad White', '3D Handle With Pu Pad Black', '029 Handle', 'Curve Handle'],
    'Plate': ['Single Lock', 'Multi Lock'],
    'Foam': ['Foam', 'PU Foam'],
    'Base': ['Spider Base', 'Mona Base', 'Bita Base', 'Nylone Black Base', 'Visitor Frame'],
    'Wheels': ['Nylone Wheel', 'Alloy Wheels', 'Black and White Wheel'],
    'Hydraulic': ['85 MM', '100 MM', '120 MM']
  },
  // Lists where "＋ Add other…" lets the user add a new option from inside the app.
  BOM_TYPE_ADD_OTHER: ['Handle', 'Plate', 'Base', 'Wheels'],
  // Auto-loaded raw-material lines per Chair Category (Kitting Master).
  // Keys must be lower-case; the app matches the selected category in lower-case.
  PRESET_MATERIALS_BY_CATEGORY: {
    'sofa': ['Lakad', 'Foam', 'Fabric', 'Cottan', 'Hardware'],
    'recliner chair': ['Lakad', 'Foam', 'Fabric', 'Hardware', 'Machine', 'Leg'],
    'recliner sofa': ['Lakad', 'Foam', 'Fabric', 'Hardware', 'Machine', 'Leg'],
    'table': ['Plyboard', 'Tape', 'Hardware', 'Key Lock', 'Channel']
  },
  CHAIR_TYPES: ['CUSTOMIZED PRODUCT', 'EXISTING PRODUCT'],
  HANDLE_TYPES: ['FIXED HANDLE', 'U TYPE HANDLE', 'OLA HANDLE', 'BAR STOOL', 'WORKSTATION', '0'],
  FABRICS: ['LEATHER', 'LEATHER BLACK', 'MESH', 'BLACK MESH', 'BROWN', 'BLACK'],
  UNITS: ['PCS', 'MTR', 'KG', 'SET', 'PAIR', 'ROLL', 'LTR', 'SQFT', 'BOX'],
  ORDER_STATUSES: ['Open', 'In Production', 'Ready', 'Dispatched', 'Delivered', 'Cancelled'],
  PRIORITIES: ['Low', 'Normal', 'High', 'Urgent'],
  PR_STATUSES: ['Pending', 'Approved', 'Ordered', 'Received', 'Cancelled']
};

/* ========== api.js ========== */
/* ============================================================
   API — talks to the Google Apps Script backend
   Writes use POST with a text/plain body (avoids CORS preflight).
   ============================================================ */
window.API = (function () {
  var cfg = window.KMS_CONFIG;

  function assertConfigured() {
    if (!cfg.API_URL || cfg.API_URL.indexOf('https://') !== 0) {
      throw new Error('API_URL is not set. Open js/config.js and paste your Apps Script Web App URL.');
    }
  }

  async function get(action, params) {
    assertConfigured();
    var url = cfg.API_URL + '?action=' + encodeURIComponent(action);
    if (params) {
      Object.keys(params).forEach(function (k) {
        url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      });
    }
    var res = await fetch(url, { method: 'GET' });
    return unwrap(await res.json());
  }

  async function post(action, payload) {
    assertConfigured();
    // count writes in flight so a background refresh never runs in the middle of a save
    window.__KMS_WRITES = (window.__KMS_WRITES || 0) + 1;
    try {
      var res = await fetch(cfg.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload || {} })
      });
      return unwrap(await res.json());
    } finally {
      window.__KMS_WRITES = Math.max(0, (window.__KMS_WRITES || 1) - 1);
    }
  }

  function unwrap(json) {
    if (!json || json.ok !== true) {
      throw new Error((json && json.error) || 'Unknown server error');
    }
    return json.data;
  }

  return {
    ping: function () { return get('ping'); },

/* ========== utils.js ========== */
/* ============================================================
   UTILS — formatting, toasts, exports (Excel / PDF / Print)
   ============================================================ */
window.U = (function () {

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

  function fmtQty(v) {
    var n = num(v);
    return (n % 1 === 0) ? n.toLocaleString('en-IN') : n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function fmtDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, ms);
    };
  }

  /* ---------- toasts ---------- */
  function toast(msg, type) {
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'info');
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(function () { el.classList.add('show'); }, 10);
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 300);
    }, 3500);
  }

  /* ---------- status pills ---------- */
  function pill(text, kind) {
    return '<span class="pill pill-' + kind + '">' + esc(text) + '</span>';
  }

  function orderStatusPill(status) {
    var map = { 'Open': 'info', 'In Production': 'warn', 'Ready': 'good', 'Dispatched': 'info', 'Delivered': 'good', 'Cancelled': 'bad' };
    return pill(status, map[status] || 'muted');
  }

  function prStatusPill(status) {
    var map = { 'Pending': 'warn', 'Approved': 'info', 'Ordered': 'info', 'Received': 'good', 'Cancelled': 'bad' };
    return pill(status, map[status] || 'muted');
  }

  /* ---------- Excel export (SheetJS) ---------- */
  function exportExcel(filename, sheetsSpec) {
    // sheetsSpec: [{name, headers:[], rows:[[..],..]}]
    var wb = XLSX.utils.book_new();
    sheetsSpec.forEach(function (s) {
      var aoa = [s.headers].concat(s.rows);
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = s.headers.map(function (h, i) {
        var w = String(h).length;
        s.rows.forEach(function (r) { w = Math.max(w, String(r[i] == null ? '' : r[i]).length); });
        return { wch: Math.min(w + 2, 40) };
      });
      XLSX.utils.book_append_sheet(wb, ws, s.name.substring(0, 31));
    });
    XLSX.writeFile(wb, filename);
  }

  /* ---------- PDF export (jsPDF + autotable) ---------- */
  function pdfDoc(title, subtitleLines) {
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
    var cfg = window.KMS_CONFIG;
    var W = doc.internal.pageSize.getWidth();

    // header band
    doc.setFillColor(16, 66, 129); // deep blue
    doc.rect(0, 0, W, 64, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text(cfg.COMPANY_NAME, 40, 28);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text(cfg.COMPANY_TAGLINE, 40, 44);

    doc.setTextColor(11, 11, 11);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(title, 40, 92);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(82, 81, 78);
    var y = 108;
    (subtitleLines || []).forEach(function (line) {
      doc.text(line, 40, y);
      y += 13;
    });
    return { doc: doc, startY: y + 8 };
  }

  function pdfTable(doc, startY, headers, rows) {
    doc.autoTable({
      startY: startY,
      head: [headers],
      body: rows,
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 5, textColor: [11, 11, 11] },
      headStyles: { fillColor: [16, 66, 129], textColor: [255, 255, 255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [246, 248, 251] },
      margin: { left: 40, right: 40 }
    });
    return doc.lastAutoTable.finalY;
  }

  function pdfFooter(doc) {
    var pages = doc.internal.getNumberOfPages();
    var W = doc.internal.pageSize.getWidth();
    var H = doc.internal.pageSize.getHeight();
    for (var i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(137, 135, 129);
      doc.text('Generated by ' + window.KMS_CONFIG.COMPANY_NAME + ' Kitting Management System — ' + new Date().toLocaleString('en-IN'), 40, H - 24);
      doc.text('Page ' + i + ' of ' + pages, W - 80, H - 24);
    }
  }

  /* ---------- Print (opens a clean print window) ---------- */
  function printHTML(title, bodyHTML) {
    var w = window.open('', '_blank');
    w.document.write(
      '<html><head><title>' + esc(title) + '</title><style>' +
      'body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b0b0b;margin:32px;}' +
      'h1{font-size:20px;margin:0 0 4px;} .sub{color:#52514e;font-size:12px;margin-bottom:16px;}' +
      'table{border-collapse:collapse;width:100%;font-size:12px;}' +
      'th{background:#104281;color:#fff;text-align:left;padding:6px 8px;}' +
      'td{border-bottom:1px solid #e1e0d9;padding:6px 8px;}' +
      '@media print{button{display:none}}' +
      '</style></head><body>' + bodyHTML +
      '<script>window.onload=function(){window.print();}<\/script></body></html>'
    );
    w.document.close();
  }

  return {
    esc: esc, num: num, fmtQty: fmtQty, fmtDate: fmtDate, todayISO: todayISO,
    debounce: debounce, toast: toast, pill: pill,
    orderStatusPill: orderStatusPill, prStatusPill: prStatusPill,
    exportExcel: exportExcel, pdfDoc: pdfDoc, pdfTable: pdfTable, pdfFooter: pdfFooter,
    printHTML: printHTML
  };
})();

/* ========== engine.js ========== */
/* ============================================================
   ENGINE — the kitting brain (pure functions, no DOM, no I/O)
   - FG requirement calculation   (order × BOM)
   - Full-kitting status          (requirement vs live stock)
   - Shortage lists               (for Purchase Requirements)
   Matching rule: an order line is matched to the Kitting Master
   ('Model No / SKU' column) by trying, in this priority:
     1. order SKU   2. order Model No   3. order Chair Category
   ============================================================ */
window.ENGINE = (function () {

  function n(v) { var x = Number(v); return isNaN(x) ? 0 : x; }
  function norm(v) { return String(v == null ? '' : v).trim().toLowerCase(); }

  /**
   * Key used to match a Kitting Master line with a Live Inventory row.
   * Case- and space-insensitive: 'ola handle black', 'Ola Handle Black' and
   * 'OLA  HANDLE BLACK' are all treated as the same item. Spelling must match.
   */
  function invKey(v) {
    return String(v == null ? '' : v).trim().toUpperCase().replace(/\s+/g, ' ');
  }

  /** The key used to find this order line's BOM. */
  function orderKeys(order) {
    return [order['SKU'], order['Model No'], order['Chair Category']]
      .map(norm).filter(function (k) { return k !== ''; });
  }

  /** Human label for the ordered product (for tables, PDFs, reports). */
  function orderLabel(order) {
    return String(order['Model No'] || order['SKU'] || order['Chair Category'] || '').trim() || '—';
  }

  function orderQty(order) { return n(order['Ordered Qty']); }

  /** Map of Material Code AND Material Name -> inventory row (case/space-insensitive). */
  function inventoryMap(inventory) {
    var map = {};
    (inventory || []).forEach(function (r) {
      var code = invKey(r['Material Code']);
      var name = invKey(r['Material Name']);
      if (code && !map[code]) map[code] = r;
      if (name && !map[name]) map[name] = r;
    });
    return map;
  }

  /** BOM lines for one product key ('Model No / SKU' column, case-insensitive). */
  function bomForKey(bom, key) {
    var k = norm(key);
    return (bom || []).filter(function (b) {
      return norm(b['Model No / SKU']) === k;
    });
  }

  /**
   * BOM lines matched by category:
   *   Order Form 'Chair Category'  ->  Kitting Master 'Sub Category'.
   * Fill the Kitting Master once for a Sub Category and every order of that
   * category picks the same BOM up automatically (FG Status / Full Kitting / PR).
   */
  function bomForSubCategory(bom, cat) {
    var k = norm(cat);
    if (!k) return [];
    var rows = (bom || []).filter(function (b) { return norm(b['Sub Category']) === k; });
    if (!rows.length) return [];
    // If several products were saved under the same Sub Category, use the most
    // recently defined one so material quantities are never counted twice.
    var groups = {}, seen = [];
    rows.forEach(function (b) {
      var g = norm(b['Model No / SKU']);
      if (!groups[g]) { groups[g] = []; seen.push(g); }
      groups[g].push(b);
    });
    return groups[seen[seen.length - 1]];
  }

  /** BOM lines for an order line: first key (SKU → Model No → Chair Category) that has a BOM wins. */
  function bomForOrder(bom, order) {
    var keys = orderKeys(order);
    for (var i = 0; i < keys.length; i++) {
      var lines = bomForKey(bom, keys[i]);
      if (lines.length) return lines;
    }
    // nothing matched by SKU / Model No -> fall back to the category BOM
    return bomForSubCategory(bom, order['Chair Category']);
  }

  /**
   * FG requirement for one order line.
   * Returns [{materialCode, materialName, perUnit, requiredQty, unit, productName, orderId}]
   */
  function orderRequirements(order, bom) {
    var qty = orderQty(order);
    return bomForOrder(bom, order).map(function (b) {
      return {
        orderId: order['Order ID'],
        orderRow: order._row,
        productName: orderLabel(order),
        materialCode: String(b['Raw Material Code'] || '').trim(),
        materialName: b['Raw Material Name'] || '',
        materialType: String(b['Type'] || '').trim(),
        perUnit: n(b['Qty Per Unit']),
        requiredQty: n(b['Qty Per Unit']) * qty,
        unit: b['Unit'] || ''
      };
    });
  }

  /** Orders that count for kitting (not delivered / cancelled). */
  function activeOrders(orders) {
    return (orders || []).filter(function (o) {
      var s = String(o['Order Status'] || '');
      return s !== 'Delivered' && s !== 'Cancelled';
    });
  }

  /* ============================================================
     STOCK ALLOCATION (reservation) - real kitting logic
     Orders ek fixed sequence me check hote hain. Pehla order apna raw
     material live stock se reserve kar leta hai; jo stock bachta hai wahi
     agle order ko milta hai. Is liye ek hi material do orders ko ek saath
     promise nahi hota, aur kisi bhi order ki shortage (jo PR me jati hai)
     hamesha NET qty hoti hai jo abhi kharidni baaki hai.
     ============================================================ */

  /** Allocation sequence ke liye order ki date (Specification ID se). */
  function orderDateMs(order) {
    var s = String(order['Specification ID'] || '').trim(), m;
    if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))) return Date.UTC(+m[3], +m[2] - 1, +m[1]);
    var dt = new Date(s);
    return (s && !isNaN(dt.getTime())) ? dt.getTime() : NaN;
  }

  /** Active orders in allocation order: oldest first, then sheet row order. */
  function allocationSequence(orders) {
    return activeOrders(orders).slice().sort(function (a, b) {
      var da = orderDateMs(a), db = orderDateMs(b);
      var ha = !isNaN(da), hb = !isNaN(db);
      if (ha && hb && da !== db) return da - db;
      if (ha !== hb) return ha ? -1 : 1;   // jinki date hai wo pehle
      return n(a._row) - n(b._row);        // same date -> sheet ka order
    });
  }

  /** Stock bucket identity jisme se ye BOM line consume karti hai. */
  function stockKey(inv, fallback) {
    if (inv) return 'INV#' + invKey(inv['Material Code'] || inv['Material Name'] || '');
    return 'MISS#' + invKey(fallback);   // material Inventory sheet me hi nahi hai
  }

  /**
   * Ek order line ka kitting check, sirf us stock ke against jo abhi FREE hai.
   * `pool` chalta hua stock ledger hai jo poore sequence me share hota hai:
   * ye order jitna reserve karta hai wo pool se hat jata hai.
   * Returns { status: 'COMPLETE'|'PENDING'|'NO_BOM', lines, shortages, coverage }
   */
  function evaluateOrderAllocated(order, bom, invMap, pool) {
    var reqs = orderRequirements(order, bom);
    if (!reqs.length) return { status: 'NO_BOM', lines: [], shortages: [], coverage: 0 };

    var okCount = 0;
    var lines = reqs.map(function (r) {
      var inv = invMap[invKey(r.materialType)] || invMap[invKey(r.materialName)] || invMap[invKey(r.materialCode)];
      var key = stockKey(inv, r.materialType || r.materialName || r.materialCode);
      var total = inv ? n(inv['Available Qty']) : 0;
      if (pool[key] === undefined) pool[key] = total;   // is material ko touch karne wala pehla order
      var free = Math.max(0, n(pool[key]));             // pehle ke orders ke baad bacha stock
      var reserved = Math.min(r.requiredQty, free);     // IS order ke liye reserve
      pool[key] = free - reserved;                      // bacha hua agle order ke liye
      var shortage = Math.max(0, r.requiredQty - reserved);
      var ok = shortage <= 0;
      if (ok) okCount++;
      return {
        orderId: r.orderId, orderRow: r.orderRow, productName: r.productName,
        materialCode: r.materialCode, materialType: r.materialType || '',
        materialName: r.materialName || (inv ? inv['Material Name'] : ''),
        perUnit: r.perUnit, requiredQty: r.requiredQty,
        totalStockQty: total,      // Inventory sheet me poora stock
        freeBeforeQty: free,       // is order ki baari par free stock
        availableQty: free,        // purane code / exports ke liye
        reservedQty: reserved,     // is order ke liye lock
        shortageQty: shortage,     // abhi kharidni hai
        unit: r.unit || (inv ? inv['Unit'] : ''),
        ok: ok, inStockRecord: !!inv, stockKey: key
      };
    });

    var shortages = lines.filter(function (l) { return !l.ok; });
    return {
      status: shortages.length ? 'PENDING' : 'COMPLETE',
      lines: lines,
      shortages: shortages,
      coverage: Math.round((okCount / lines.length) * 100)
    };
  }

  /** Ek order ka check poore stock ke against (bina reservation) - compatibility. */
  function evaluateOrder(order, bom, invMap) {
    return evaluateOrderAllocated(order, bom, invMap, {});
  }

  /**
   * Har active order ko stock RESERVATION ke saath evaluate karo.
   * Returns [{ order, result, seq }] allocation order me (seq 1 = pehle serve hua).
   */
  function evaluateAll(orders, bom, inventory) {
    var invMap = inventoryMap(inventory);
    var pool = {};                               // chalta hua stock ledger
    return allocationSequence(orders).map(function (o, i) {
      var result = evaluateOrderAllocated(o, bom, invMap, pool);
      result.seq = i + 1;
      return { order: o, result: result, seq: i + 1 };
    });
  }

  /** evaluateAll() ke result me se ek order line ka evaluation dhoondho. */
  function evaluationFor(evaluations, row) {
    for (var i = 0; i < (evaluations || []).length; i++) {
      if (Number(evaluations[i].order._row) === Number(row)) return evaluations[i];
    }
    return null;
  }

  /**
   * Di gayi evaluations ki shortages ko material ke hisaab se merge karo.
   * Har shortage pehle se hi earlier orders ke reserved stock ko ghata kar (net)
   * hai, is liye merged `shortageQty` bilkul wahi qty hai jo kharidni hai.
   */
  function aggregateShortages(evaluations) {
    var agg = {}, out = [];
    evaluations.forEach(function (ev) {
      ev.result.shortages.forEach(function (s) {
        var key = s.stockKey || invKey(s.materialType || s.materialName || s.materialCode);
        if (!agg[key]) {
          agg[key] = {
            materialCode: s.materialCode, materialType: s.materialType || '',
            materialName: s.materialType || s.materialName, unit: s.unit,
            requiredQty: 0, availableQty: n(s.totalStockQty), reservedQty: 0, shortageQty: 0,
            orders: [], products: []
          };
          out.push(agg[key]);
        }
        agg[key].requiredQty += s.requiredQty;
        agg[key].reservedQty += n(s.reservedQty);
        agg[key].shortageQty += s.shortageQty;
        if (agg[key].orders.indexOf(s.orderId) === -1) agg[key].orders.push(s.orderId);
        if (agg[key].products.indexOf(s.productName) === -1) agg[key].products.push(s.productName);
      });
    });
    return out.sort(function (a, b) { return b.shortageQty - a.shortageQty; });
  }

  /** Total raw-material consumption implied by orders (for reports). */
  function consumption(orders, bom, filterFn) {
    var agg = {};
    (orders || []).forEach(function (o) {
      if (filterFn && !filterFn(o)) return;
      orderRequirements(o, bom).forEach(function (r) {
        var key = invKey(r.materialType || r.materialName || r.materialCode);
        if (!agg[key]) agg[key] = { materialCode: r.materialCode, materialType: r.materialType || '', materialName: r.materialType || r.materialName, unit: r.unit, qty: 0 };
        agg[key].qty += r.requiredQty;
      });
    });
    return Object.keys(agg).map(function (k) { return agg[k]; })
      .sort(function (a, b) { return b.qty - a.qty; });
  }

  /** Distinct product list from BOM: [{category, sub, product, lineCount}] */
  function bomProducts(bom) {
    var map = {};
    (bom || []).forEach(function (b) {
      var key = norm(b['Model No / SKU']);
      if (!key) return;
      if (!map[key]) map[key] = { category: b['Chair Category'] || '', sub: b['Sub Category'] || '', product: String(b['Model No / SKU']).trim(), lineCount: 0 };
      map[key].lineCount++;
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return a.product.localeCompare(b.product); });
  }

  return {
    invKey: invKey,
    inventoryMap: inventoryMap,
    bomForKey: bomForKey,
    bomForSubCategory: bomForSubCategory,
    bomForOrder: bomForOrder,
    orderKeys: orderKeys,
    orderLabel: orderLabel,
    orderQty: orderQty,
    orderRequirements: orderRequirements,
    activeOrders: activeOrders,
    evaluateOrder: evaluateOrder,
    evaluateOrderAllocated: evaluateOrderAllocated,
    evaluateAll: evaluateAll,
    evaluationFor: evaluationFor,
    allocationSequence: allocationSequence,
    orderDateMs: orderDateMs,
    stockKey: stockKey,
    aggregateShortages: aggregateShortages,
    consumption: consumption,
    bomProducts: bomProducts
  };
})();

/* ========== views.js ========== */
/* ============================================================
   VIEWS — renders every tab. Pure DOM generation from APP.state.
   ============================================================ */
window.VIEWS = (function () {
  var cfg = window.KMS_CONFIG;

  /* ================= shared helpers ================= */

  function D() { return APP.state.data; }
  function S() { return (APP.state.search || '').toLowerCase(); }

  function matchesSearch(obj, fields) {
    var q = S();
    if (!q) return true;
    return fields.some(function (f) {
      return String(obj[f] == null ? '' : obj[f]).toLowerCase().indexOf(q) !== -1;
    });
  }

  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function options(list, selected) {
    return list.map(function (v) {
      return '<option value="' + U.esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + U.esc(v) + '</option>';
    }).join('');
  }

  /** Dropdown list from the Masters sheet (live), with config fallback. */
  function M(name, fallback) {
    var m = (D().masters || {})[name];
    return (m && m.length) ? m : (fallback || []);
  }
  function mCat() { return M('Chair Category', cfg.CHAIR_CATEGORIES); }
  function mSub() { return M('Sub Category', cfg.SUB_CATEGORIES); }
  function mType() { return M('Chair Type', cfg.CHAIR_TYPES); }
  function mHandle() { return M('Handle Type', cfg.HANDLE_TYPES); }
  function mFabric() { return M('Fabric File & Code', cfg.FABRICS); }

  /* --- Kitting Master "Type" dropdowns (lists live in the Masters tab) --- */
  function bomTypeKey(name) {
    var n = String(name || '').trim().toLowerCase();
    if (!n) return '';
    var base = Object.keys(cfg.BOM_TYPE_LISTS || {});
    var keys = base.slice();
    Object.keys(D().masters || {}).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
    for (var i = 0; i < keys.length; i++) {
      if (String(keys[i]).trim().toLowerCase() === n) return keys[i];
    }
    for (var j = 0; j < base.length; j++) {
      var k = String(base[j]).toLowerCase().replace(/s$/, '');
      if (new RegExp('(^|\\s)' + k + 's?(\\s|$)').test(n)) return base[j];
    }
    return '';
  }
  function bomTypeOptions(key) { return M(key, (cfg.BOM_TYPE_LISTS || {})[key] || []); }
  function bomTypeCanAdd(key) { return (cfg.BOM_TYPE_ADD_OTHER || []).indexOf(key) !== -1; }

  /* --- "Type" lists built LIVE from the Inventory sheet --------------------
     Rule: in the Inventory tab every row whose Category cell (column C)
     matches the raw-material name puts its Material Name (column B) into that
     row's Type list. Matching ignores case (UPPER / lower / Sentence all fine),
     extra spaces, and singular vs plural (WHEEL = Wheels). */
  function invNorm(v) { return String(v == null ? '' : v).trim().toUpperCase().replace(/\s+/g, ' '); }
  function invTypeOptions(name) {
    var n = invNorm(name);
    if (!n) return [];
    var rows = D().inventory || [];
    var seen = {}, out = [];
    function push(v) {
      var t = String(v == null ? '' : v).trim();
      if (!t) return;
      var k = invNorm(t);
      if (seen[k]) return;
      seen[k] = 1; out.push(t);
    }
    /* Naam ke alias bhi try karo (agar sheet me spelling thodi alag likhi ho). */
    var cand = [n];
    var al = cfg.MATERIAL_CATEGORY_ALIASES || {};
    Object.keys(al).forEach(function (k) {
      var a = invNorm(k), b = invNorm(al[k]);
      if (a === n && cand.indexOf(b) === -1) cand.push(b);
      if (b === n && cand.indexOf(a) === -1) cand.push(a);
    });
    /* 1) Category cell exactly match kare - case aur extra spaces ignore. */
    rows.forEach(function (r) { if (cand.indexOf(invNorm(r['Category'])) !== -1) push(r['Material Name'] || r['Material Code']); });
    /* 2) Singular/plural ka farq bhi ignore: "Wheels" <-> "WHEEL". */
    if (!out.length) {
      var sng = cand.map(function (c) { return c.replace(/S$/, ''); });
      rows.forEach(function (r) {
        var c = invNorm(r['Category']);
        if (c && sng.indexOf(c.replace(/S$/, '')) !== -1) push(r['Material Name'] || r['Material Code']);
      });
    }
    if (!out.length) {
      /* Category column abhi blank hai? Tab tak fall back: inventory ke wo items
         jinke apne naam me yahi word aata hai, taaki list khali na rahe. */
      var re = new RegExp('(^|\\s)' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$)');
      rows.forEach(function (r) {
        var nm = String(r['Material Name'] || r['Material Code'] || '').trim();
        if (re.test(invNorm(nm))) push(nm);
      });
    }
    out.sort(function (a, b) { return String(a).localeCompare(String(b)); });
    return out;
  }
  /* Raw materials whose Type box is a tick-box (multi select) list. */
  function bomIsMulti(name) {
    var n = invNorm(name);
    return (cfg.BOM_MULTI_SELECT_MATERIALS || []).some(function (m) { return invNorm(m) === n; });
  }

  /* ── One-time re-edit rule for Kitting Master (BOM) ─────────────
     Once a product's BOM has been created it may be re-edited only ONE
     time. After that single saved edit every edit button of that product
     stays locked. The used-edit list is stored in the Settings sheet
     (key BOM_EDIT_LOCKS) so the lock travels with the database, and it is
     mirrored in localStorage for an instant / offline check. SKU matching
     ignores case and extra spaces, exactly like the Type matching. */
  var BOM_EDIT_LOCK_KEY = 'kms-bom-edit-locks-v1';
  function bomLockId(sku) { return invNorm(sku); }
  function bomLocksLocal() {
    try { return JSON.parse(localStorage.getItem(BOM_EDIT_LOCK_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function bomLocksSheet() {
    var raw = (D().settings || {}).BOM_EDIT_LOCKS;
    if (!raw) return {};
    try { return JSON.parse(raw) || {}; } catch (e) { return {}; }
  }
  function bomLocks() {
    var m = bomLocksSheet(), l = bomLocksLocal();
    Object.keys(l).forEach(function (k) { m[k] = Math.max(Number(m[k] || 0), Number(l[k] || 0)); });
    return m;
  }
  function bomEditsUsed(sku) { return Number(bomLocks()[bomLockId(sku)] || 0); }
  function bomEditLocked(sku) { return bomEditsUsed(sku) >= 1; }
  function bomLockBadge(sku) {
    return bomEditLocked(sku)
      ? '<span class="small muted" title="This product BOM has already used its one allowed re-edit">🔒 Edit used</span> '
      : '<span class="small muted" title="This product BOM can still be re-edited once">✏️ 1 edit left</span> ';
  }
  async function bomMarkEdited(sku) {
    var id = bomLockId(sku);
    if (!id) return;
    var m = bomLocks();
    m[id] = Number(m[id] || 0) + 1;
    try { localStorage.setItem(BOM_EDIT_LOCK_KEY, JSON.stringify(m)); } catch (e) { }
    try {
      var cur = D().settings || {}, s = {};
      Object.keys(cur).forEach(function (k) { s[k] = cur[k]; });
      s.BOM_EDIT_LOCKS = JSON.stringify(m);
      await API.saveSettings(s);
      cur.BOM_EDIT_LOCKS = s.BOM_EDIT_LOCKS;
    } catch (e) { }
  }

  /** Make a table sortable by clicking headers. */
  function makeSortable(table) {
    var ths = table.querySelectorAll('th[data-sort]');
    ths.forEach(function (th, idx) {
      th.addEventListener('click', function () {
        var tbody = table.querySelector('tbody');
        var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
        var col = Array.prototype.indexOf.call(th.parentNode.children, th);
        var dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
        ths.forEach(function (t) { delete t.dataset.dir; t.querySelector('.arrow') && t.querySelector('.arrow').remove(); });
        th.dataset.dir = dir;
        th.insertAdjacentHTML('beforeend', '<span class="arrow">' + (dir === 'asc' ? '▲' : '▼') + '</span>');
        rows.sort(function (a, b) {
          var av = a.children[col] ? a.children[col].textContent.trim() : '';
          var bv = b.children[col] ? b.children[col].textContent.trim() : '';
          var an = parseFloat(av.replace(/,/g, '')), bn = parseFloat(bv.replace(/,/g, ''));
          var cmp;
          if (!isNaN(an) && !isNaN(bn)) cmp = an - bn;
          else cmp = av.localeCompare(bv);
          return dir === 'asc' ? cmp : -cmp;
        });
        rows.forEach(function (r) { tbody.appendChild(r); });
      });
    });
  }

    formCard.insertAdjacentHTML('beforeend', dl);

    /* ---- Auto Raw Material Code (RM-0001 style, never repeats) ---- */
    function usedCodes() {
      var s = {};
      (d.inventory || []).forEach(function (r) {
        var c = String(r['Material Code'] || '').trim().toUpperCase();
        if (c) s[c] = 1;
      });
      (d.bom || []).forEach(function (r) {

        if (c) s[c] = 1;
      });
      formCard.querySelectorAll('#bomLines tbody tr .lc').forEach(function (inp) {
        var c = String(inp.value || '').trim().toUpperCase();
        if (c) s[c] = 1;
      });

    }
    function nextRmCode() {
      var used = usedCodes(), max = 0;
      Object.keys(used).forEach(function (c) {
        var m = /^RM-(\d+)$/.exec(c);
        if (m) { var v = parseInt(m[1], 10); if (v > max) max = v; }
      });
      var n = max + 1, code;
      do { code = 'RM-' + String(n).padStart(4, '0'); n++; } while (used[code]);
      return code;
